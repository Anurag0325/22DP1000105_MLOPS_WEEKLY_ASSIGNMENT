name: Week 7 - IRIS Deploy & Stress Test
on:
  push:
    branches: ["week_7"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          project_id: "project-eac74fb9-0e15-492a-ab1"
          workload_identity_provider: "projects/39319986440/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-ci-dvc@project-eac74fb9-0e15-492a-ab1.iam.gserviceaccount.com"

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push image
        run: |
          cd app
          docker build -t us-central1-docker.pkg.dev/project-eac74fb9-0e15-492a-ab1/iris-repo/iris-api:latest .
          docker push us-central1-docker.pkg.dev/project-eac74fb9-0e15-492a-ab1/iris-repo/iris-api:latest

      - name: Get GKE credentials
        run: gcloud container clusters get-credentials test-iris-v1 --zone=us-central1-a

      - name: Deploy to GKE
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl rollout status deployment/iris-api --timeout=120s

  stress-test:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          project_id: "project-eac74fb9-0e15-492a-ab1"
          workload_identity_provider: "projects/39319986440/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-ci-dvc@project-eac74fb9-0e15-492a-ab1.iam.gserviceaccount.com"

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Get GKE credentials
        run: gcloud container clusters get-credentials test-iris-v1 --zone=us-central1-a

      - name: Install wrk
        run: sudo apt-get update -y && sudo apt-get install -y wrk

      - name: Get service external IP
        id: ip
        run: |
          IP=$(kubectl get svc iris-api-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Write wrk payload script
        run: |
          cat > post.lua << 'LUA'
          wrk.method = "POST"
          wrk.body   = '{"sepal_length":5.1,"sepal_width":3.5,"petal_length":1.4,"petal_width":0.2}'
          wrk.headers["Content-Type"] = "application/json"
          LUA

      - name: Run wrk load test
        run: |
          wrk -t4 -c1000 -d30s --latency -s post.lua \
            http://${{ steps.ip.outputs.ip }}/predict | tee wrk_result.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wrk-results
          path: wrk_result.txt
