name: IRIS Pipeline CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[gs]" pytest

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: "project-eac74fb9-0e15-492a-ab1"
          workload_identity_provider: "projects/39319986440/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-ci-dvc@project-eac74fb9-0e15-492a-ab1.iam.gserviceaccount.com"

      - name: Pull data & model via DVC
        run: dvc pull

      - name: Run pytest suite
        run: pytest tests/ -v
