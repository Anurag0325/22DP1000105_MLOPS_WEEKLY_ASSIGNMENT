name: IRIS Pipeline CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "dvc[gs]" pytest

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: "project-eac74fb9-0e15-492a-ab1"
          workload_identity_provider: "projects/39319986440/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-ci-dvc@project-eac74fb9-0e15-492a-ab1.iam.gserviceaccount.com"

      - name: Pull data & model via DVC
        run: dvc pull

      - name: Run pytest suite
        id: run_tests
        run: pytest tests/ -v --tb=short 2>&1 | tee test_output.txt
        continue-on-error: true

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Publish CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## IRIS Pipeline CI Report" > report.md
          echo "" >> report.md
          echo "**Branch:** ${{ github.ref_name }} | **Event:** ${{ github.event_name }}" >> report.md
          echo "" >> report.md
          echo "### Test Results" >> report.md
          echo '```' >> report.md
          cat test_output.txt >> report.md
          echo '```' >> report.md
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cml comment create report.md
          else
            cml comment create report.md --commit-sha="${{ github.sha }}"
          fi

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
