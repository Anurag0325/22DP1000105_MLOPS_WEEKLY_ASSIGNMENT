apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iris-api
  template:
    metadata:
      labels:
        app: iris-api
    spec:
      containers:
        - name: iris-api
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8200
          readinessProbe:
            httpGet:
              path: /
              port: 8200
            initialDelaySeconds: 5
